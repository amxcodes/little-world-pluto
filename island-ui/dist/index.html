<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root {
  font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  font-optical-sizing: auto;
  font-synthesis: none;
}
* { box-sizing: border-box; }
html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
.island {
  --bg: #000; --card: #101012; --card-hover: #1b1b1f;
  --text: #f5f5f7; --muted: #ababb2; --line: #34343a; --accent: #c7ef84;

  min-height: 0; background: var(--bg); color: var(--text); font-size: 13px;
}
.island.light {
  --bg: #f6f6f7; --card: #fff; --card-hover: #eeeef0;
  --text: #171719; --muted: #5e5e66; --line: #d9d9de; --accent: #547b1e;
  --success: #216b43; --success-ink: #e4f3e9;
  --warning: #79540d; --warning-ink: #f4ecd8;
  --recording: #a43129; --recording-ink: #f8e9e8;
  --weather-rain: #316d93;
}
.island.accent-ice { --accent-a: #c0f6ff; --accent-b: #82cef5; --accent-ink: #09212b; --accent: #9bdcf2; }
.island.accent-rose { --accent-a: #ffe0e5; --accent-b: #ffa4bc; --accent-ink: #30151d; --accent: #f2a8bc; }
.island.accent-violet { --accent-a: #e8dbff; --accent-b: #b79cf6; --accent-ink: #241838; --accent: #cbb7f7; }
.island.light.accent-ice { --accent: #1d6482; }
.island.light.accent-rose { --accent: #9b415b; }
.island.light.accent-violet { --accent: #6347a1; }


/* Selection stays inside the card, with one bounded list and no floating menu. */
.agent-option-overview { display: grid; align-content: start; gap: 6px; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.agent-option-row { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; min-height: 56px; padding: 8px; border: 0; border-radius: 12px; background: transparent; text-align: left; }

.agent-option-row strong, .agent-option-browser-list strong { overflow: hidden; font-size: 13px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
.agent-option-row small, .agent-option-browser-list small { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

.agent-option-browser { display: flex; flex: 1; flex-direction: column; gap: 10px; min-height: 0; }
.agent-option-browser-head { display: flex; align-items: center; gap: 10px; flex: none; }

.agent-option-browser-head small { color: var(--muted); font-size: 11px; }
.agent-browser-back { display: grid; place-items: center; min-width: 58px; height: 28px; padding: 0 9px; border: 0; border-radius: 999px; color: var(--text); background: var(--card-hover); font-size: 10px; }
.agent-option-browser-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.agent-option-browser-list > button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 7px 8px; border: 0; border-radius: 12px; background: transparent; text-align: left; }
.agent-option-browser-list > button.is-cursor, .agent-option-browser-list > button:hover { background: var(--card-hover); }
.agent-option-browser-list > button[aria-selected="true"] > svg { color: var(--accent); }
.agent-option-browser-list > .agent-browser-more { justify-content: center; color: var(--muted); font-size: 12px; }
.agent-task-view:has(.agent-start) .agent-composer-slot { flex: 1; }
.agent-task-view:has(.agent-start) .agent-composer { height: 100%; }
.agent-task-view:has(.agent-start) .agent-composer textarea { flex: 1; max-height: none; }
.agent-start .agent-project { max-width: 65%; }
.agent-start .agent-project button { min-width: 0; max-width: 100%; }
.agent-start .agent-project button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-composer.has-context textarea { height: 54px !important; max-height: 54px !important; }
.agent-composer.has-context { gap: 6px; padding-block: 10px; }
.agent-config-view:has(.agent-option-browser) > .agent-config-heading { display: none; }
.agent-workspace .agent-search input:focus-visible, .agent-workspace .agent-composer textarea:focus-visible { outline: none; }
.agent-workspace .agent-search:focus-within { background: var(--card-hover); }
.agent-option-overview > .settings-line { padding: 12px 8px; }
.home-primary.has-player > :is(.primary-heading, .media-content) {
  transition: opacity 180ms ease, transform 220ms cubic-bezier(.2,.8,.2,1), filter 180ms ease;
}
.home-primary:has(> .media-session-panel:not(.is-closing)) > :is(.primary-heading, .media-content) {
  opacity: 0; transform: translateY(-3px) scale(.985); filter: blur(2px); pointer-events: none;
}
.island .media-session-option:active { transform: none; }
.media-session-close svg { display: block; flex: none; }
@media (max-width: 540px) { .agent-config-chip { max-width: 132px; } .agent-dictate { margin-left: auto; } }

/* Agents uses Home's neutral surfaces and accent only for intentional focus. */
.agent-workspace { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; height: var(--agent-height, 260px); max-height: 480px; color: var(--text); transition: gap 230ms cubic-bezier(.2,.8,.2,1); }
.page-content > .agent-workspace { flex: none; height: var(--agent-height, 260px); }

.agent-tabs button:hover { color: var(--text); background: var(--card-hover); }
.agent-tabs button.selected { color: var(--accent-ink); background: var(--accent-gradient); }
.agent-tab-spacer { flex: 1; }
.agent-tabs .agent-new-task { color: var(--text); border: 1px solid var(--line); }
.agent-full-toolbar { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
.agent-full-toolbar .agent-new-task { width: 100px; height: 30px; min-height: 30px; padding-inline: 8px; color: var(--text); border: 1px solid var(--line); }
.agent-task-view { display: flex; flex: 1; flex-direction: column; gap: 12px; min-height: 0; transition: gap 220ms cubic-bezier(.2,.8,.2,1); }
.agent-start { display: flex; flex: none; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; padding: 8px 4px; }

.agent-project { display: flex; align-items: center; gap: 10px; min-width: 0; }
.agent-project button, .agent-empty button { display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 31px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--card-hover); font-size: 11px; }
.agent-project small { overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.agent-extra-folders { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
.agent-extra-folders > button, .agent-extra-folders > span, .agent-prepare { display: inline-flex; align-items: center; gap: 5px; min-height: 27px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: var(--card-hover); font-size: 10px; }
.agent-extra-folders > span > button { display: grid; place-items: center; width: 17px; height: 17px; padding: 0; border: 0; color: inherit; background: transparent; }
.agent-prepare { align-self: flex-start; color: var(--text); }
.agent-prepare:hover, .agent-extra-folders > button:hover { color: var(--accent-ink); background: var(--accent-gradient); }
.agent-config-controls { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.agent-choice-control { display: flex; flex: 1 1 150px; flex-direction: column; gap: 5px; min-width: 0; color: var(--muted); font-size: 10px; }
.agent-choice-control.compact { flex: 1 1 128px; }
.agent-choice-label { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
.agent-choice-options { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.agent-choice-control.has-many .agent-choice-options { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; max-height: 156px; overflow: auto; padding: 2px; scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
.agent-choice-control.compact.has-many .agent-choice-options { max-height: 132px; }
.agent-choice-current { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 34px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--card-hover); text-align: left; font-size: 11px; }
.agent-choice-current > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-choice-current > i { flex: none; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); transition: transform 140ms ease; }
.agent-choice-current[aria-expanded="true"] > i { transform: rotate(225deg) translate(-1px, -1px); }
.agent-choice-current:hover, .agent-choice-current[aria-expanded="true"] { border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); background: color-mix(in srgb, var(--accent) 6%, var(--card-hover)); }
.agent-choice-picker { display: grid; gap: 5px; min-width: 0; margin-top: 5px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 10px 28px color-mix(in srgb, #000 18%, transparent); }
.agent-choice-option { flex: 0 0 auto; min-width: 0; min-height: 27px; padding: 4px 9px; overflow: hidden; border: 1px solid transparent; border-radius: 9px; color: var(--muted); background: var(--card-hover); text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
.agent-choice-option[aria-pressed="true"], .agent-choice-option[aria-selected="true"] { color: var(--accent-ink); background: var(--accent-gradient); font-weight: 620; }
.agent-choice-option:hover:not(:disabled), .agent-choice-option:focus-visible { color: var(--accent-ink); background: var(--accent-gradient); }
.agent-choice-search { width: 100%; min-width: 0; min-height: 28px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 9px; outline: none; color: var(--text); background: var(--card); font: inherit; font-size: 10px; }
.agent-choice-empty { padding: 5px 2px; color: var(--muted); }
.agent-config-controls.compact .agent-choice-control { flex: 1 1 120px; }
.agent-config-controls .settings-line { flex: 1 1 190px; }
.agent-config-controls.compact .agent-choice-control { flex: 0 1 auto; }
.agent-config-controls.compact .settings-line { flex: 0 1 auto; }
.agent-composer { position: relative; display: flex; flex-direction: column; gap: 10px; flex: none; min-height: 136px; padding: 16px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); }
.agent-composer:focus-within { border-color: var(--line); }
.agent-composer textarea { width: 100%; min-height: 54px; max-height: 112px; padding: 4px 2px; overflow-y: auto; resize: none; border: 0; outline: 0; color: var(--text); background: transparent; font: inherit; font-size: 15px; line-height: 1.55; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.agent-composer textarea::placeholder { color: var(--muted); }

.agent-command-list button { display: flex; gap: 9px; width: 100%; padding: 5px 7px; border: 0; border-radius: 7px; color: var(--text); background: transparent; text-align: left; font-size: 10px; }
.agent-command-list button:hover { background: var(--card-hover); }
.agent-command-list span { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
.agent-composer-footer { flex: none; gap: 8px; min-height: 36px; padding: 0; border: 0; }
.agent-composer-spacer { flex: 1; min-width: 0; }
.agent-attach { display: grid; place-items: center; flex: none; width: 32px; height: 32px; min-height: 32px; padding: 0; border: 0; border-radius: 50%; color: var(--muted); background: transparent; }
.agent-attach:hover { color: var(--text); background: color-mix(in srgb, var(--text) 14%, var(--card-hover)); }
.agent-dictate, .agent-config-chip { display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: none; min-width: 30px; height: 30px; padding: 0 8px; border: 0; border-radius: 999px; color: var(--muted); background: transparent; transition: color 130ms ease, background-color 130ms ease; }
.agent-config-chip { max-width: 190px; border: 0; background: transparent; font-size: 12px; }
.agent-config-chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-dictate:hover, .agent-config-chip:hover { color: var(--accent-ink); background: var(--accent-gradient); }
.agent-submit { display: grid; place-items: center; flex: 0 0 36px; width: 36px; min-width: 36px; height: 36px; min-height: 36px; padding: 0; border: 0; border-radius: 50%; color: var(--bg); background: var(--text); transition: color 130ms ease, background-color 130ms ease, transform 130ms ease; }
.agent-submit:hover:not(:disabled), .agent-submit:focus-visible:not(:disabled) { color: var(--accent-ink); background: var(--accent-gradient); }
.agent-submit:disabled, .agent-submit:disabled:hover { opacity: 1; border: 1px solid var(--line); color: var(--muted); background: var(--card-hover); cursor: default; }
.agent-files { display: flex; flex-wrap: nowrap; gap: 6px; min-height: 34px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.agent-file-chip { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; max-width: 190px; min-height: 31px; padding: 3px 5px 3px 7px; border: 0; border-radius: 10px; color: var(--text); background: var(--card-hover); font-size: 11px; }
.agent-file-kind { display: grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 7px; color: var(--text); background: var(--card); }

.agent-mention-menu { display: flex; flex: none; flex-direction: column; min-height: 0; height: 132px; overflow: hidden; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: var(--card); }
.agent-mention-filters { display: flex; align-items: center; gap: 4px; flex: none; padding: 5px 6px; border-bottom: 1px solid var(--line); }
.agent-mention-filters > span { margin-right: auto; color: var(--muted); font-size: 11px; font-weight: 500; }
.agent-mention-filters > button { min-height: 26px; padding: 3px 8px; border: 0; border-radius: 999px; color: var(--muted); background: transparent; font-size: 11px; }
.agent-mention-filters > button:hover { color: var(--accent-ink); background: var(--accent-gradient); }
.agent-mention-results { display: grid; align-content: start; gap: 2px; min-height: 0; padding: 4px; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

.agent-mention-results > button:hover .agent-mention-icon, .agent-mention-results > button[aria-selected="true"] .agent-mention-icon { color: var(--accent-ink); background: var(--accent-gradient); }

.agent-ui-text { margin: 0; color: var(--text); font-size: 13px; line-height: 1.48; white-space: pre-wrap; overflow-wrap: anywhere; }
